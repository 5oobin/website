<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2228%22 font-size=%2224%22>📷</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Soobin's Film Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="site-title">Soobin's Film Archive</div>
        <div class="tabs">
            <button class="tab-btn active" data-filter="all">All</button>
            <button class="tab-btn" data-filter="infrared">Infrared</button>

    <div class="grid" id="grid"></div>

    <div class="lightbox" id="lightbox">

        <img id="lightbox-img" src="" alt="">
    </div>

    <script src="photos-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
